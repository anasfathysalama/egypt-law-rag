name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q

  rebuild-index:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('uv.lock') }}
      - run: uv sync --frozen
      - name: Choose the corpus
        id: corpus
        run: |
          if [ -f data/processed/civil_code.json ]; then
            echo "path=data/processed/civil_code.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=tests/fixtures/articles_sample.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the vector index
        env:
          ARTICLES_PATH: ${{ steps.corpus.outputs.path }}
          EMBEDDING_CACHE: .cache/fastembed
        run: uv run python scripts/build_index.py
      - uses: actions/upload-artifact@v4
        with:
          name: vector-index
          path: data/index

  docker:
    needs: rebuild-index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=$(echo '${{ secrets.DOCKER_USERNAME }}' | tr '[:upper:]' '[:lower:]')/egylaw-rag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
