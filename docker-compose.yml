services:
  egylaw-rag:
    build: .
    image: egylaw-rag:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data/index:/app/data/index:ro

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.0
    ports:
      - "5000:5000"
    user: "0:0"
    volumes:
      - ./reports/mlflow:/mlflow
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
